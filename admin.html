<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #0f172a; padding: 15px; }
        .admin-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e2e8f0; border-radius: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #10b981; color: white; }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h3 { margin-bottom: 12px; font-size: 16px; color: #10b981; }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
        button { background: #10b981; color: white; border: none; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 8px; text-align: left; font-size: 12px; }
        th { color: #64748b; background: #f1f5f9; }
        .btn-delete { background: #ef4444; width: auto; padding: 6px 12px; font-size: 11px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h2>ADMIN CONTROL CENTER 🛠️</h2>
<br>

<div class="admin-nav">
    <button class="tab-btn active" onclick="showTab('adsTab', this)">📢 Ad Management</button>
    <button class="tab-btn" onclick="showTab('prodTab', this)">🛒 Products</button>
    <button class="tab-btn" onclick="showTab('catTab', this)">📁 Categories</button>
    <button class="tab-btn" onclick="showTab('ordersTab', this)">📋 Orders</button>
</div>

<!-- SECTION 1: AD RUNNING PAGE MANAGEMENT -->
<div id="adsTab" class="admin-section active">
    <div class="card">
        <h3>Add Running Ad (ഓഫർ പരസ്യം ചേർക്കുക)</h3>
        <label style="font-size: 11px; color:#666;">Ad Banner Photo:</label>
        <input type="file" id="adImageFile" accept="image/*">
        
        <label style="font-size: 11px; color:#666;">ആഡ് എത്ര സമയം റൺ ചെയ്യണം (Hours & Minutes):</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="adHours" placeholder="Hours (ഉദാ: 2)" value="0">
            <input type="number" id="adMinutes" placeholder="Minutes (ഉദാ: 30)" value="0">
        </div>
        
        <button onclick="addAd()">Publish Ad</button>
    </div>

    <div class="card">
        <h3>Active Ads List</h3>
        <table>
            <thead>
                <tr>
                    <th>Banner</th>
                    <th>Expires At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adsTableBody"></tbody>
        </table>
    </div>
</div>

<!-- SECTION 2: PRODUCTS WITH UNIT & MIN QTY -->
<div id="prodTab" class="admin-section">
    <div class="card">
        <h3>Add Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <select id="pCat"></select>
        <input type="number" id="pPrice" placeholder="Price (₹ per Unit/Kg)">
        
        <label style="font-size: 11px; color:#666;">യൂണിറ്റ് ടൈപ്പ് തിരഞ്ഞെടുക്കുക (Kg or Piece):</label>
        <select id="pUnitType">
            <option value="kg">Kilogram (Kg)</option>
            <option value="pc">Piece (Pc)</option>
        </select>

        <label style="font-size: 11px; color:#666;">തുടങ്ങേണ്ട കുറഞ്ഞ അളവ് (Minimum Qty Start):</label>
        <input type="number" step="0.001" id="pMinQty" placeholder="ഉദാ: 0.250 (250g-ന്) അല്ലെങ്കിൽ 1 (Piece-ന്)">

        <input type="number" id="pStock" placeholder="Total Stock (Kg/Qty)">
        <label style="font-size: 11px; color:#666;">Product Photo:</label>
        <input type="file" id="prodImageFile" accept="image/*">
        <button onclick="addProduct()">Add Product</button>
    </div>
</div>

<!-- SECTION 3: CATEGORIES -->
<div id="catTab" class="admin-section">
    <div class="card">
        <h3>Add Category</h3>
        <input type="text" id="catName" placeholder="Category Name">
        <input type="file" id="catImageFile" accept="image/*">
        <button onclick="addCategory()">Save Category</button>
    </div>
</div>

<!-- SECTION 4: ORDERS -->
<div id="ordersTab" class="admin-section">
    <div class="card">
        <h3>Received Orders</h3>
        <div id="ordersList">ഓർഡറുകൾ ഇവിടെ കാണാം...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDK_YOTaJf__QlDz_1HASByhR5dV0tvuM4",
        authDomain: "fresh-pick-1346b.firebaseapp.com",
        projectId: "fresh-pick-1346b",
        storageBucket: "fresh-pick-1346b.firebasestorage.app",
        messagingSenderId: "266778456541",
        appId: "1:266778456541:web:246305a1c69535c8efc634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showTab(tabId, btn) {
        document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // --- ADS MANAGEMENT ---
    async function addAd() {
        const fileInput = document.getElementById("adImageFile");
        const hrs = Number(document.getElementById("adHours").value) || 0;
        const mins = Number(document.getElementById("adMinutes").value) || 0;

        if(!fileInput.files[0]) return alert("പരസ്യത്തിന്റെ ചിത്രം തിരഞ്ഞെടുക്കുക!");
        if(hrs === 0 && mins === 0) return alert("റണ്ണിങ് ടൈം സെറ്റ് ചെയ്യുക!");

        const image = await getBase64(fileInput.files[0]);
        const durationMs = ((hrs * 60) + mins) * 60 * 1000;
        const expiryTime = Date.now() + durationMs;

        await db.collection("ads").add({ image, expiryTime, createdAt: Date.now() });
        alert("Ad വിജയകരമായി പബ്ലിഷ് ചെയ്തു!");
        fileInput.value = "";
    }

    db.collection("ads").onSnapshot(snap => {
        const tbody = document.getElementById("adsTableBody");
        tbody.innerHTML = "";
        snap.forEach(doc => {
            const ad = doc.data();
            const expDate = new Date(ad.expiryTime).toLocaleTimeString();
            tbody.innerHTML += `
                <tr>
                    <td><img src="${ad.image}" style="width:60px; height:35px; border-radius:4px; object-fit:cover;"></td>
                    <td>${expDate}</td>
                    <td><button class="btn-delete" onclick="deleteAd('${doc.id}')">Remove</button></td>
                </tr>
            `;
        });
    });

    async function deleteAd(id) {
        if(confirm("ഈ ആഡ് നീക്കം ചെയ്യണമെന്നുണ്ടോ?")) {
            await db.collection("ads").doc(id).delete();
        }
    }

    // --- PRODUCT MANAGEMENT ---
    db.collection("categories").onSnapshot(snap => {
        const pCatSelect = document.getElementById("pCat");
        pCatSelect.innerHTML = "";
        snap.forEach(doc => {
            pCatSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`;
        });
    });

    async function addProduct() {
        const name = document.getElementById("pName").value.trim();
        const category = document.getElementById("pCat").value;
        const price = Number(document.getElementById("pPrice").value);
        const unitType = document.getElementById("pUnitType").value;
        const minQty = Number(document.getElementById("pMinQty").value) || (unitType==='kg'? 0.25 : 1);
        const stockKg = Number(document.getElementById("pStock").value);
        const fileInput = document.getElementById("prodImageFile");

        if(name && fileInput.files[0]) {
            const img = await getBase64(fileInput.files[0]);
            await db.collection("products").add({ name, category, price, unitType, minQty, stockKg, img, status: 'available' });
            alert("Product Saved!");
        } else {
            alert("വിവരങ്ങൾ പൂർണ്ണമായി നൽകുക!");
        }
    }

    async function addCategory() {
        const name = document.getElementById("catName").value.trim();
        const fileInput = document.getElementById("catImageFile");
        if(name && fileInput.files[0]) {
            const logo = await getBase64(fileInput.files[0]);
            await db.collection("categories").add({ name, logo });
            alert("Category Added!");
        }
    }
</script>
</body>
</html>
