<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRESH PICK - Admin Dashboard</title>
    <style>
        :root {
            --primary: #0f5132;
            --accent: #20c997;
            --bg: #f8f9fa;
            --dark: #212529;
        }
        * { box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); padding: 15px; color: var(--dark); }
        .container { max-width: 700px; margin: 0 auto; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; border-left: 5px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .file-upload-box {
            border: 2px dashed var(--accent); padding: 15px; text-align: center; border-radius: 8px; background: #e8f8f5; cursor: pointer; display: block;
        }
        .file-upload-box input[type="file"] { display: none; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }

        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }

        .product-card { background: white; padding: 12px; border-radius: 10px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 12px; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; }
        
        .user-list { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .user-item { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>FRESH PICK - Advanced Admin</h2>
        <p style="font-size: 12px; opacity: 0.8;">മൾട്ടി കാറ്റഗറി & യൂസർ മാനേജ്‌മെന്റ്</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <span style="font-size: 12px; color: #6c757d;">ആകെ യൂസേഴ്സ്</span>
            <h3 id="totalUsers">0</h3>
        </div>
        <div class="stat-card">
            <span style="font-size: 12px; color: #6c757d;">ആകെ ഉൽപ്പന്നങ്ങൾ</span>
            <h3 id="totalProducts">0</h3>
        </div>
    </div>

    <!-- Product Form -->
    <div class="form-section">
        <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 16px;">പുതിയ ഉൽപ്പന്നം ചേർക്കുക</h3>
        
        <div class="form-group">
            <label>ഉൽപ്പന്നത്തിന്റെ പേര്</label>
            <input type="text" id="pName" placeholder="ഉദാ: ആപ്പിൾ / തക്കാളി">
        </div>

        <div class="row">
            <div class="form-group">
                <label>കാറ്റഗറി</label>
                <select id="pCategory">
                    <option value="vegetables">Vegetables (പച്ചക്കറികൾ)</option>
                    <option value="fruits">Fruits (പഴങ്ങൾ)</option>
                    <option value="grocery">Grocery (ഗ്രോസറി)</option>
                    <option value="beverages">Beverages (പാനീയങ്ങൾ)</option>
                    <option value="offers">Today Special Offers 🏷️</option>
                </select>
            </div>
            <div class="form-group">
                <label>അളവ് തരം (Unit Type)</label>
                <select id="pUnitType">
                    <option value="weight">തൂക്കം (Kg / Grams)</option>
                    <option value="piece">എണ്ണം (Pieces / Packet)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>ബേസ് സ്റ്റാർട്ടിംഗ് അളവ് (Min Option)</label>
                <select id="pMinUnit">
                    <option value="50g">50 Grams</option>
                    <option value="100g">100 Grams</option>
                    <option value="250g">250 Grams</option>
                    <option value="500g">500 Grams</option>
                    <option value="1kg">1 Kg</option>
                    <option value="1pc">1 Piece / Packet</option>
                </select>
            </div>
            <div class="form-group">
                <label>1 Kg / 1 Piece വില (₹)</label>
                <input type="number" id="pPrice" placeholder="ഉദാ: 100">
            </div>
        </div>

        <div class="form-group">
            <label>ഫോട്ടോ സെലക്ട് ചെയ്യുക</label>
            <label class="file-upload-box">
                <span>📸 ക്ലിക്ക് ചെയ്ത് ഫോട്ടോ തിരഞ്ഞെടുക്കുക</span>
                <input type="file" id="pImgFile" accept="image/*" onchange="previewAndCompress(event)">
            </label>
            <center><img id="imgPreview" class="preview-img"></center>
        </div>
        
        <button id="saveBtn" onclick="addProduct()">Save Product</button>
    </div>

    <!-- Registered Users List -->
    <div class="user-list">
        <h3 style="font-size: 15px; color: var(--primary); margin-bottom: 10px;">രജിസ്റ്റർ ചെയ്ത ഉപഭോക്താക്കൾ (Users)</h3>
        <div id="usersList">ലോഡ് ചെയ്യുന്നു...</div>
    </div>

    <!-- Existing Products -->
    <h3 style="margin-top: 25px; margin-bottom: 10px; font-size: 16px;">നിലവിലുള്ള ഉൽപ്പന്നങ്ങൾ</h3>
    <div id="adminProductList">ലോഡ് ചെയ്യുന്നു...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDK_YOTaJf__QlDz_1HASByhR5dV0tvuM4",
        authDomain: "fresh-pick-1346b.firebaseapp.com",
        projectId: "fresh-pick-1346b",
        storageBucket: "fresh-pick-1346b.firebasestorage.app",
        messagingSenderId: "266778456541",
        appId: "1:266778456541:web:246305a1c69535c8efc634"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let base64ImageString = "";

    function previewAndCompress(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 300;
                    const scaleFactor = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleFactor;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    base64ImageString = canvas.toDataURL("image/jpeg", 0.7);

                    const preview = document.getElementById("imgPreview");
                    preview.src = base64ImageString;
                    preview.style.display = "block";
                };
            };
            reader.readAsDataURL(file);
        }
    }

    async function addProduct() {
        const name = document.getElementById('pName').value;
        const category = document.getElementById('pCategory').value;
        const unitType = document.getElementById('pUnitType').value;
        const minUnit = document.getElementById('pMinUnit').value;
        const price = Number(document.getElementById('pPrice').value);
        const btn = document.getElementById('saveBtn');

        if (!name || !price) {
            alert('ദയവായി പേരും വിലയും നൽകുക!');
            return;
        }

        const defaultImg = "https://i.imgur.com/8uO0MhR.png";
        const finalImg = base64ImageString ? base64ImageString : defaultImg;

        btn.innerText = "സേവ് ചെയ്യുന്നു... ⏳";
        btn.disabled = true;

        try {
            await db.collection("products").add({
                name: name,
                category: category,
                unitType: unitType,
                minUnit: minUnit,
                price: price,
                img: finalImg,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("ഉൽപ്പന്നം ചേർത്തു!");
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('imgPreview').style.display = 'none';
            base64ImageString = "";
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Save Product";
            btn.disabled = false;
        }
    }

    // Load Products
    db.collection("products").onSnapshot((snapshot) => {
        const list = document.getElementById('adminProductList');
        document.getElementById('totalProducts').innerText = snapshot.size;
        list.innerHTML = "";
        snapshot.forEach((doc) => {
            const p = doc.data();
            list.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-img">
                    <div style="flex-grow:1;">
                        <strong>${p.name}</strong> <small>(${p.category || 'veg'})</small><br>
                        <span style="color:var(--primary); font-weight:bold;">₹${p.price}</span> / base: ${p.minUnit || '1kg'}
                    </div>
                    <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
                </div>
            `;
        });
    });

    // Load Users
    db.collection("users").onSnapshot((snapshot) => {
        const userList = document.getElementById('usersList');
        document.getElementById('totalUsers').innerText = snapshot.size;
        userList.innerHTML = "";
        snapshot.forEach((doc) => {
            const u = doc.data();
            userList.innerHTML += `
                <div class="user-item">
                    <span>📱 <strong>${u.phone || doc.id}</strong> (${u.name || 'User'})</span>
                    <span style="color:orange; font-weight:bold;">🏆 ${u.points || 0} Pts</span>
                </div>
            `;
        });
    });

    function deleteProduct(id) {
        if (confirm("ഡിലീറ്റ് ചെയ്യണോ?")) {
            db.collection("products").doc(id).delete();
        }
    }
</script>

</body>
</html>
