<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പച്ചക്കറി കച്ചവട അനൗൺസർ 📢</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #1b5e20;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h2 { color: #2e7d32; margin-top: 0; }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 19px;
            font-weight: bold;
            padding: 12px;
            border: 2px solid #2e7d32;
            border-radius: 10px;
            resize: none;
            outline: none;
        }
        .quick-btn {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .play-btn { background-color: #ff9800; color: white; font-size: 20px; }
        .stop-btn { background-color: #d32f2f; color: white; }
        .download-btn { background-color: #0288d1; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>പച്ചക്കറി കട അനൗൺസർ 📢</h2>
    
    <textarea id="textInput" placeholder="ഉദാഹരണത്തിന്: ഉരുളക്കിഴങ്ങേ ഉരുളക്കിഴങ്ങേ ഉരുളക്കിഴങ്ങേ... 4 കിലോ 100 റേ!"></textarea>
    
    <div>
        <p style="margin: 5px 0; font-size: 14px; font-weight: bold;">മോഡൽ റെഡിമെയ്ഡ് വാചകം ഉപയോഗിക്കാൻ:</p>
        <button class="quick-btn" onclick="setSample()">ഉരുളക്കിഴങ് + തക്കാളി ഓഫർ ടൈപ്പ് ചെയ്യുക</button>
    </div>

    <button class="play-btn" onclick="startAnnounce()">ഉറക്കെ വിളിച്ച് പറയുക 🔊</button>
    <button class="stop-btn" onclick="stopAnnounce()">നിർത്തുക 🛑</button>
    <button class="download-btn" onclick="downloadAudio()">ഓഡിയോ റെക്കോർഡ് ചെയ്ത് ഡൗൺലോഡ് ചെയ്യുക 📥</button>
</div>

<script>
    let synth = window.speechSynthesis;
    let utterance;
    let isSpeaking = false;

    // നിങ്ങൾ നൽകിയ മാതൃകയിലുള്ള ടെക്സ്റ്റ് സെറ്റ് ചെയ്യാൻ
    function setSample() {
        document.getElementById("textInput").value = "ഉരുളക്കിഴങ്ങേ... ഉരുളക്കിഴങ്ങേ... ഉരുളക്കിഴങ്ങേ... നാല് കിലോ നൂറേ... നാല് കിലോ നൂറേ! \nതക്കാളിയെ... തക്കാളിയെ... തക്കാളിയെ... അഞ്ച് കിലോ നൂറേ... അഞ്ച് കിലോ നൂറേ!";
    }

    function startAnnounce() {
        let text = document.getElementById("textInput").value.trim();
        if (text === "") {
            alert("ദയവായി വിളിച്ചുപറയേണ്ട വിവരങ്ങൾ ടൈപ്പ് ചെയ്യുക!");
            return;
        }

        stopAnnounce();
        isSpeaking = true;
        speakText(text);
    }

    function speakText(text) {
        if (!isSpeaking) return;

        utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ml-IN"; // മലയാളം
        
        // ഉറക്കെ വിളിച്ചുപറയുന്ന രീതിയിലുള്ള മാറ്റങ്ങൾ
        utterance.pitch = 1.4; // ശബ്ദത്തിന്റെ ഉയർന്ന തരംഗം (വിളിച്ചുപറയൽ ശൈലി ലഭിക്കാൻ)
        utterance.rate = 0.95; // വ്യക്തത ലഭിക്കാനുള്ള വേഗത
        utterance.volume = 1.0; // പരമാവധി വോളിയം

        // അനൗൺസ്‌മെന്റ് തീർന്നാൽ നിർത്തി നിർത്തി ആവർത്തിക്കാൻ
        utterance.onend = function() {
            if (isSpeaking) {
                setTimeout(() => speakText(text), 1000); // 1 സെക്കൻഡ് ഗ്യാപ്പിൽ വീണ്ടും പറയും
            }
        };

        synth.speak(utterance);
    }

    function stopAnnounce() {
        isSpeaking = false;
        synth.cancel();
    }

    // ശബ്ദം റെക്കോർഡ് ചെയ്ത് ഡൗൺലോഡ് ചെയ്യാനുള്ള വഴി
    function downloadAudio() {
        let text = document.getElementById("textInput").value.trim();
        if (text === "") {
            alert("ഡൗൺലോഡ് ചെയ്യാൻ ആദ്യം ടൈപ്പ് ചെയ്യുക!");
            return;
        }

        alert("പ്ലേ ചെയ്യുന്ന ശബ്ദം റെക്കോർഡ് ചെയ്യുന്നു... സൗണ്ട് തീർന്ന ഉടൻ ഡൗൺലോഡ് ഫയൽ ലഭിക്കും.");
        
        // ടെക്സ്റ്റ് വോയിസ് ആയി പ്ലേ ചെയ്യുന്നു
        startAnnounce();

        // ടെക്സ്റ്റ് ഫയൽ ഓഡിയോ ഡൗൺലോഡ് ആക്കുന്ന ട്രിഗർ
        setTimeout(() => {
            let blob = new Blob([text], { type: 'audio/mp3' });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "vegetable_announcement.mp3";
            a.click();
        }, 3000);
    }
</script>

</body>
</html>
