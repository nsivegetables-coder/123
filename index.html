<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRESH PICK - Premium Grocery</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-dark: #1a4d2e;
            --primary-light: #4caf50;
            --accent: #ffc107;
            --bg-color: #f0f4f0;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), #2d6a4f);
            color: white;
            padding: 20px;
            border-radius: 0 0 25px 25px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .points-display {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .points-icon { color: var(--accent); font-size: 16px; }

        .search-bar {
            background: white;
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            margin-left: 10px;
            color: var(--text-main);
        }

        .container { padding: 20px; }

        .promo-banner {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }

        .promo-banner h2 { font-size: 20px; margin-bottom: 5px; }
        .promo-banner p { font-size: 13px; opacity: 0.9; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title { font-size: 18px; font-weight: 700; color: var(--primary-dark); }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            background: #eee;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            height: 38px;
            overflow: hidden;
        }

        .product-qty { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price { font-size: 16px; font-weight: 700; color: var(--primary-dark); }

        .add-btn {
            background-color: var(--primary-light);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            z-index: 90;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            text-align: center;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            position: relative;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary-dark); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; display: block; }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff5252;
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 25px 25px 0 0;
            width: 100%;
            max-height: 80%;
            overflow-y: auto;
        }

        .close-btn { font-size: 24px; color: var(--text-sub); cursor: pointer; }

        .checkout-btn {
            background-color: var(--primary-dark);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
        }

        .scratch-card {
            width: 250px;
            height: 125px;
            background: linear-gradient(135deg, #bdbdbd, #9e9e9e);
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            color: #333;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }

        .scratch-card.revealed {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">FRESH PICK</div>
            <div class="points-display">
                <span class="points-icon">⭐</span>
                <span><span id="rewardPoints">0</span> / 100</span>
            </div>
        </div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="തിരയുക..." onkeyup="filterProducts()">
        </div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <h2>ഗ്രാൻഡ് ഓഫർ!</h2>
            <p>നിങ്ങളുടെ പ്രിയപ്പെട്ട ഉൽപ്പന്നങ്ങൾക്ക് പോയിന്റുകൾ നേടൂ!</p>
        </div>

        <div class="section-header">
            <h2 class="section-title">ലഭ്യമായ ഉൽപ്പന്നങ്ങൾ</h2>
        </div>
        <div class="products-grid" id="productList">
            <p style="grid-column: span 2; text-align: center;">ഉൽപ്പന്നങ്ങൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🏠</span>Home</div>
        <div class="nav-item" onclick="toggleModal('cartModal')">
            <span class="nav-icon">🛒</span>Cart
            <div class="cart-badge" id="cartCount">0</div>
        </div>
    </nav>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>നിങ്ങളുടെ കാർട്ട്</h2>
                <span class="close-btn" onclick="toggleModal('cartModal')">&times;</span>
            </div>
            <div id="cartItems" style="margin-top:15px;"></div>
            <div style="margin-top: 20px; display: flex; justify-content: space-between; font-weight: 700;">
                <span>ആകെ തുക:</span>
                <span>₹<span id="cartTotal">0</span></span>
            </div>
            <button class="checkout-btn" onclick="checkout()">ഓർഡർ ചെയ്യുക</button>
        </div>
    </div>

    <!-- Scratch Card Modal -->
    <div class="modal" id="scratchModal">
        <div class="modal-content" style="border-radius: 25px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>🎉 സർപ്രൈസ് ഓഫർ!</h2>
                <span class="close-btn" onclick="toggleModal('scratchModal')">&times;</span>
            </div>
            <div style="text-align: center; padding: 20px 0;">
                <p>താഴെ കാണുന്ന കാർഡ് സ്ക്രാച്ച് ചെയ്യൂ!</p>
                <div class="scratch-card" id="card" onclick="revealReward()">Scratch Here!</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDK_YOTaJf__QlDz_1HASByhR5dV0tvuM4",
            authDomain: "fresh-pick-1346b.firebaseapp.com",
            projectId: "fresh-pick-1346b",
            storageBucket: "fresh-pick-1346b.firebasestorage.app",
            messagingSenderId: "266778456541",
            appId: "1:266778456541:web:246305a1c69535c8efc634"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let fetchedProducts = [];
        let fetchedRewards = [];
        let cart = [];
        let points = 0;

        // Firestore Products Fetch
        db.collection("products").onSnapshot((snapshot) => {
            fetchedProducts = [];
            snapshot.forEach(doc => {
                fetchedProducts.push({ id: doc.id, ...doc.data() });
            });
            renderProducts(fetchedProducts);
        });

        // Firestore Rewards Fetch
        db.collection("rewards").onSnapshot((snapshot) => {
            fetchedRewards = [];
            snapshot.forEach(doc => {
                fetchedRewards.push(doc.data().offer);
            });
        });

        function renderProducts(products) {
            const list = document.getElementById('productList');
            if(products.length === 0) {
                list.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #666;">ഉൽപ്പന്നങ്ങൾ ഒന്നും ലഭ്യമല്ല!</p>`;
                return;
            }

            const defaultImg = "https://i.imgur.com/8uO0MhR.png";

            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img ? p.img : defaultImg}" 
                         alt="${p.name}" 
                         class="product-img"
                         onerror="this.src='${defaultImg}'">
                    <div class="product-name">${p.name}</div>
                    <div class="product-qty">${p.qty || ''}</div>
                    <div class="product-footer">
                        <div class="product-price">₹${p.price}</div>
                        <button class="add-btn" onclick="addToCart('${p.id}')">+</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fetchedProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function addToCart(id) {
            const item = fetchedProducts.find(p => p.id === id);
            cart.push(item);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = total;

            const cartItemsDiv = document.getElementById('cartItems');
            if(cart.length === 0) {
                cartItemsDiv.innerHTML = `<p style="color:#666; text-align:center;">കാർട്ട് കാലിയാണ്</p>`;
                return;
            }
            cartItemsDiv.innerHTML = cart.map(item => `
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;">
                    <span>${item.name} (${item.qty || ''})</span>
                    <strong>₹${item.price}</strong>
                </div>
            `).join('');
        }

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkout() {
            if(cart.length === 0) return alert("കാർട്ട് കാലിയാണ്!");
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const earnedPoints = Math.floor(total / 10);
            points += earnedPoints;
            document.getElementById('rewardPoints').innerText = points;

            alert(`ഓർഡർ വിജയിച്ചു! ലഭിച്ച പോയിന്റുകൾ: ${earnedPoints}`);
            cart = [];
            updateCartUI();
            toggleModal('cartModal');

            if(points >= 100) {
                points -= 100;
                document.getElementById('rewardPoints').innerText = points;
                toggleModal('scratchModal');
            }
        }

        function revealReward() {
            const card = document.getElementById('card');
            if (!card.classList.contains('revealed')) {
                const reward = fetchedRewards.length > 0 
                    ? fetchedRewards[Math.floor(Math.random() * fetchedRewards.length)] 
                    : "₹20 Cash Back! 🎟️";
                card.innerText = reward;
                card.classList.add('revealed');
            }
        }
    </script>
</body>
</html>
