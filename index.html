<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRESH PICK</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --primary-light: #e6f4ea; --bg: #f8fafc; --text-dark: #0f172a; --text-muted: #64748b; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-dark); padding-bottom: 70px; font-size: 13px; }

        .app-header { background: #f1f8f5; padding: 10px 15px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .points-pill { background: #fff; padding: 4px 10px; border-radius: 15px; font-weight: 700; font-size: 11px; color: #f59e0b; }

        .search-container { padding: 8px 15px; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 12px; outline: none; }

        /* Compact Circular Categories */
        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 5px 15px 10px; scrollbar-width: none; }
        .cat-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 50px; }
        .cat-circle { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 2px solid transparent; }
        .cat-item.active .cat-circle { border-color: var(--primary); background: var(--primary-light); }
        .cat-circle img { width: 26px; height: 26px; object-fit: contain; }
        .cat-label { font-size: 10px; font-weight: 600; margin-top: 3px; }

        /* Compact Product Grid */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 15px; }
        .product-card { background: white; border-radius: 12px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; position: relative; }
        .product-img { width: 100%; height: 85px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; }
        .product-name { font-size: 12px; font-weight: 700; }
        .product-unit { font-size: 10px; color: var(--text-muted); }
        .price-text { font-size: 13px; font-weight: 700; color: var(--primary); margin: 3px 0; }

        .counter-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 3px; border-radius: 6px; }
        .btn-step { background: white; border: 1px solid #cbd5e1; width: 22px; height: 22px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .add-cart-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 11px; margin-top: 5px; cursor: pointer; }
        
        .badge-status { position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.9); color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-coming { background: rgba(245, 158, 11, 0.9); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e2e8f0; z-index: 99; }
        .nav-item { text-align: center; font-size: 10px; color: var(--text-muted); cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .page-view { display: none; }
        .page-view.active-view { display: block; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="homeView" class="page-view active-view">
    <div class="app-header">
        <div class="top-row">
            <strong>FRESH PICK 🌿</strong>
            <div class="points-pill">🏆 <span id="userPoints">0</span> Pts</div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="renderProducts()">
    </div>
    <div class="categories-scroll" id="catContainer"></div>
    <div class="products-grid" id="productGrid"></div>
</div>

<div id="cartView" class="page-view" style="padding:15px;">
    <h3>Cart 🛒</h3>
    <div id="cartList" style="margin-top:10px;"></div>
    <button id="checkoutBtn" onclick="checkout()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:8px; margin-top:15px; font-weight:bold; display:none;">Place Order</button>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">🏠<br>Home</div>
    <div class="nav-item" onclick="switchTab('cart', this)">🛒<br>Cart (<span id="cartCount">0</span>)</div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDK_YOTaJf__QlDz_1HASByhR5dV0tvuM4", authDomain: "fresh-pick-1346b.firebaseapp.com", projectId: "fresh-pick-1346b", storageBucket: "fresh-pick-1346b.firebasestorage.app", messagingSenderId: "266778456541", appId: "1:266778456541:web:246305a1c69535c8efc634" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let products = [], categories = [], cart = [], selectedCat = 'all';

    db.collection("categories").onSnapshot(snap => {
        categories = [{id:'all', name:'All', logo:'https://cdn-icons-png.flaticon.com/512/3081/3081840.png'}];
        snap.forEach(doc => categories.push({id: doc.id, ...doc.data()}));
        renderCategories();
    });

    db.collection("products").onSnapshot(snap => {
        products = [];
        snap.forEach(doc => products.push({id: doc.id, ...doc.data()}));
        renderProducts();
    });

    function renderCategories() {
        const c = document.getElementById("catContainer");
        c.innerHTML = categories.map(cat => `
            <div class="cat-item ${selectedCat === cat.name ? 'active':''}" onclick="filterCat('${cat.name}')">
                <div class="cat-circle"><img src="${cat.logo}"></div>
                <span class="cat-label">${cat.name}</span>
            </div>
        `).join('');
    }

    function filterCat(name) { selectedCat = name; renderCategories(); renderProducts(); }

    function renderProducts() {
        const grid = document.getElementById("productGrid");
        const search = document.getElementById("searchInput").value.toLowerCase();
        grid.innerHTML = "";

        const list = products.filter(p => (selectedCat === 'All' || p.category === selectedCat) && p.name.toLowerCase().includes(search));

        list.forEach(p => {
            const isOutOfStock = p.status === 'out' || p.stockKg <= 0;
            const isComingSoon = p.status === 'coming';
            
            let badge = '', btnAttr = '';
            if(isOutOfStock) { badge = `<span class="badge-status">Out of Stock</span>`; btnAttr = 'disabled style="background:#ccc"'; }
            else if(isComingSoon) { badge = `<span class="badge-status badge-coming">Coming Soon</span>`; btnAttr = 'disabled style="background:#ccc"'; }

            grid.innerHTML += `
                <div class="product-card">
                    ${badge}
                    <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="product-name">${p.name}</div>
                    <div class="product-unit">Stock: ${p.stockKg} kg</div>
                    <div class="price-text">₹${p.price} / kg</div>
                    <button class="add-cart-btn" ${btnAttr} onclick="addToCart('${p.id}')">${isOutOfStock ? 'No Stock' : isComingSoon ? 'Soon' : 'Add 🛒'}</button>
                </div>
            `;
        });
    }

    function addToCart(id) {
        const item = products.find(p => p.id === id);
        if(item.stockKg >= 1) {
            cart.push(item);
            document.getElementById("cartCount").innerText = cart.length;
            alert(`${item.name} added!`);
        }
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active-view'));
        document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(tab+'View').classList.add('active-view');
        if(tab === 'cart') renderCart();
    }

    function renderCart() {
        const l = document.getElementById("cartList");
        if(cart.length === 0) { l.innerHTML = "Cart is Empty!"; document.getElementById("checkoutBtn").style.display="none"; return; }
        l.innerHTML = cart.map(i => `<div style="padding:8px; background:#fff; margin-bottom:5px;">${i.name} - ₹${i.price}</div>`).join('');
        document.getElementById("checkoutBtn").style.display="block";
    }

    async function checkout() {
        for(let item of cart) {
            const ref = db.collection("products").doc(item.id);
            const doc = await ref.get();
            const currentStock = doc.data().stockKg - 1;
            await ref.update({
                stockKg: currentStock,
                status: currentStock <= 0 ? 'out' : doc.data().status
            });
        }
        alert("Order Successful!");
        cart = [];
        document.getElementById("cartCount").innerText = 0;
        switchTab('home', document.querySelectorAll('.nav-item')[0]);
    }
</script>
</body>
</html>
