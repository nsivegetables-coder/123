<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRESH PICK - Fresh Groceries</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-light: #e6f4ea;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-dark); padding-bottom: 90px; }

        /* Top Header */
        .app-header { background: #f1f8f5; padding: 20px 20px 10px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .location-badge { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .points-pill { background: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; color: #f59e0b; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }

        /* Promo Banner */
        .hero-banner { background: linear-gradient(135deg, #d1fae5, #a7f3d0); padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin: 15px 20px; box-shadow: 0 10px 20px rgba(16,185,129,0.08); }
        .hero-title { font-size: 18px; font-weight: 700; color: #065f46; margin-bottom: 5px; }
        .hero-sub { font-size: 12px; color: #047857; }

        /* Search Bar */
        .search-container { padding: 0 20px; margin-bottom: 15px; }
        .search-input { width: 100%; padding: 14px 18px; border: none; background: white; border-radius: 16px; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); outline: none; }

        /* Categories Horizontal Bar */
        .categories-wrapper { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; margin-bottom: 20px; }
        .cat-card { background: white; padding: 10px 16px; border-radius: 16px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
        .cat-card.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Product Grid */
        .section-title { padding: 0 20px; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        
        .product-card { background: white; border-radius: 20px; padding: 14px; box-shadow: 0 6px 15px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
        .product-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .product-unit { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }

        /* Step Quantity Counter */
        .counter-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 6px; border-radius: 12px; margin-top: 8px; }
        .btn-step { background: white; border: 1px solid #cbd5e1; width: 28px; height: 28px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-size: 12px; font-weight: 700; }
        .price-text { font-size: 15px; font-weight: 700; color: var(--primary); }

        /* Bottom Nav Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-muted); text-decoration: none; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        /* Login Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-card { background: white; width: 85%; max-width: 360px; padding: 25px; border-radius: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-card input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; }
        .modal-card button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; margin-top: 10px; cursor: pointer; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- Mobile Login Popup -->
<div id="loginModal" class="modal">
    <div class="modal-card">
        <h3 style="font-size: 18px; margin-bottom: 6px;">FRESH PICK-ലേക്ക് സ്വാഗതം 🌿</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">തുടരുന്നതിന് പേരും ഫോൺ നമ്പറും നൽകുക</p>
        <input type="text" id="userName" placeholder="നിങ്ങളുടെ പേര്">
        <input type="tel" id="userPhone" placeholder="മൊബൈൽ നമ്പർ">
        <button onclick="loginUser()">ലോഗിൻ ചെയ്യുക</button>
    </div>
</div>

<!-- App Header -->
<div class="app-header">
    <div class="top-row">
        <div class="location-badge">📍 <span>Kerala, India</span></div>
        <div class="points-pill">🏆 <span id="userPoints">0</span> Pts</div>
    </div>
</div>

<!-- Hero Banner -->
<div class="hero-banner">
    <div>
        <div class="hero-title">Fresh Vegetables & Fruits</div>
        <div class="hero-sub">Up to 30% Off Everyday Essentials</div>
    </div>
    <span style="font-size: 35px;">🧺</span>
</div>

<!-- Search -->
<div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search vegetables, fruits..." onkeyup="renderProducts()">
</div>

<!-- Categories -->
<div class="categories-wrapper">
    <div class="cat-card active" onclick="filterCat('all', this)">All Items</div>
    <div class="cat-card" onclick="filterCat('offers', this)">Flash Deals 🏷️</div>
    <div class="cat-card" onclick="filterCat('vegetables', this)">Vegetables 🥦</div>
    <div class="cat-card" onclick="filterCat('fruits', this)">Fruits 🍎</div>
    <div class="cat-card" onclick="filterCat('grocery', this)">Grocery 🌾</div>
</div>

<!-- Products List -->
<div class="section-title">Best Selling</div>
<div class="products-grid" id="productGrid">
    <p style="grid-column: span 2; text-align: center;">ലോഡ് ചെയ്യുന്നു...</p>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <a href="#" class="nav-item active">🏠<br>Home</a>
    <a href="#" class="nav-item">🗂️<br>Categories</a>
    <a href="#" class="nav-item">🛒<br>Cart</a>
    <a href="#" class="nav-item" onclick="logout()">👤<br>Account</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDK_YOTaJf__QlDz_1HASByhR5dV0tvuM4",
        authDomain: "fresh-pick-1346b.firebaseapp.com",
        projectId: "fresh-pick-1346b",
        storageBucket: "fresh-pick-1346b.firebasestorage.app",
        messagingSenderId: "266778456541",
        appId: "1:266778456541:web:246305a1c69535c8efc634"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allProducts = [];
    let productQuantities = {}; // { productId: multiplierStep }
    let currentUserPhone = localStorage.getItem("userPhone");
    let currentCategory = "all";

    window.onload = function() {
        if(currentUserPhone) {
            document.getElementById("loginModal").style.display = "none";
            loadUserData();
        }
    }

    async function loginUser() {
        const name = document.getElementById("userName").value.trim();
        const phone = document.getElementById("userPhone").value.trim();

        if(phone.length < 10) {
            alert("ശരിയായ മൊബൈൽ നമ്പർ നൽകുക!");
            return;
        }

        currentUserPhone = phone;
        localStorage.setItem("userPhone", phone);

        const userRef = db.collection("users").doc(phone);
        const doc = await userRef.get();

        if(!doc.exists()) {
            await userRef.set({
                name: name || "Customer",
                phone: phone,
                points: 10,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("ബോണസായി 10 പോയിന്റുകൾ ലഭിച്ചു! 🎉");
        }

        document.getElementById("loginModal").style.display = "none";
        loadUserData();
    }

    function loadUserData() {
        db.collection("users").doc(currentUserPhone).onSnapshot(doc => {
            if(doc.exists) {
                document.getElementById("userPoints").innerText = doc.data().points || 0;
            }
        });
    }

    function logout() {
        if(confirm("ലോഗ് ഔട്ട് ചെയ്യണോ?")) {
            localStorage.removeItem("userPhone");
            location.reload();
        }
    }

    db.collection("products").onSnapshot(snapshot => {
        allProducts = [];
        snapshot.forEach(doc => {
            allProducts.push({ id: doc.id, ...doc.data() });
        });
        renderProducts();
    });

    function renderProducts() {
        const grid = document.getElementById("productGrid");
        const search = document.getElementById("searchInput").value.toLowerCase();
        grid.innerHTML = "";

        const filtered = allProducts.filter(p => {
            const matchesCat = (currentCategory === "all") || (p.category === currentCategory);
            const matchesSearch = p.name.toLowerCase().includes(search);
            return matchesCat && matchesSearch;
        });

        if(filtered.length === 0) {
            grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #888;">പ്രോഡക്റ്റുകൾ ഒന്നുമില്ല!</p>`;
            return;
        }

        filtered.forEach(p => {
            if(!productQuantities[p.id]) {
                productQuantities[p.id] = 1; // Default step is 1 multiplier
            }

            const currentMultiplier = productQuantities[p.id];
            const unitLabel = getFormattedQtyLabel(p.minUnit, currentMultiplier);
            const totalPrice = calculateStepPrice(p.minUnit, p.price, currentMultiplier);

            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" onerror="this.src='https://i.imgur.com/8uO0MhR.png'">
                    <div class="product-name">${p.name}</div>
                    <div class="product-unit">Base Unit: ${p.minUnit}</div>

                    <div class="price-text">₹${totalPrice}</div>

                    <div class="counter-row">
                        <button class="btn-step" onclick="changeQty('${p.id}', -1)">-</button>
                        <span class="qty-val">${unitLabel}</span>
                        <button class="btn-step" onclick="changeQty('${p.id}', 1)">+</button>
                    </div>
                </div>
            `;
        });
    }

    // Dynamic Step Calculation based on Admin Setting
    function changeQty(productId, delta) {
        if(productQuantities[productId] + delta >= 1) {
            productQuantities[productId] += delta;
            renderProducts();
        }
    }

    function getFormattedQtyLabel(minUnit, multiplier) {
        if(minUnit === "1pc") return `${multiplier} Pc`;
        if(minUnit === "50g") {
            const grams = 50 * multiplier;
            return grams >= 1000 ? `${(grams/1000).toFixed(1)} kg` : `${grams} g`;
        }
        if(minUnit === "100g") {
            const grams = 100 * multiplier;
            return grams >= 1000 ? `${(grams/1000).toFixed(1)} kg` : `${grams} g`;
        }
        if(minUnit === "250g") {
            const grams = 250 * multiplier;
            return grams >= 1000 ? `${(grams/1000).toFixed(1)} kg` : `${grams} g`;
        }
        if(minUnit === "500g") {
            const grams = 500 * multiplier;
            return grams >= 1000 ? `${(grams/1000).toFixed(1)} kg` : `${grams} g`;
        }
        if(minUnit === "1kg") return `${multiplier} kg`;
        return `${multiplier}`;
    }

    function calculateStepPrice(minUnit, basePrice, multiplier) {
        let singleStepPrice = basePrice;
        if(minUnit === "50g") singleStepPrice = basePrice * 0.05;
        else if(minUnit === "100g") singleStepPrice = basePrice * 0.1;
        else if(minUnit === "250g") singleStepPrice = basePrice * 0.25;
        else if(minUnit === "500g") singleStepPrice = basePrice * 0.5;
        
        return Math.round(singleStepPrice * multiplier);
    }

    function filterCat(cat, element) {
        currentCategory = cat;
        document.querySelectorAll(".cat-card").forEach(el => el.classList.remove("active"));
        element.classList.add("active");
        renderProducts();
    }
</script>

</body>
</html>
