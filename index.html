<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പച്ചക്കറി കട അനൗൺസ്‌മെന്റ്</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2e7d32; }
        textarea {
            width: 90%;
            height: 100px;
            font-size: 18px;
            padding: 10px;
            border: 2px solid #2e7d32;
            border-radius: 8px;
            resize: none;
        }
        button {
            width: 95%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .play-btn { background-color: #2e7d32; color: white; }
        .stop-btn { background-color: #c62828; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>പച്ചക്കറി അനൗൺസർ 📢</h2>
    <textarea id="textInput" placeholder="ഇവിടെ ടൈപ്പ് ചെയ്യുക... (ഉദാഹരണത്തിന്: തക്കാളി കിലോ 30 രൂപ)"></textarea>
    
    <button class="play-btn" onclick="startAnnounce()">അനൗൺസ്‌മെന്റ് തുടങ്ങുക 🔊</button>
    <button class="stop-btn" onclick="stopAnnounce()">നിർത്തുക 🛑</button>
</div>

<script>
    let synth = window.speechSynthesis;
    let utterance;
    let isSpeaking = false;

    function startAnnounce() {
        let text = document.getElementById("textInput").value.trim();
        if (text === "") {
            alert("ദയവായി എന്തെങ്കിലും ടൈപ്പ് ചെയ്യുക!");
            return;
        }

        stopAnnounce(); // നിലവിലുള്ളത് നിർത്താൻ
        isSpeaking = true;
        speakText(text);
    }

    function speakText(text) {
        if (!isSpeaking) return;

        utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ml-IN"; // മലയാളം വോയിസ്
        utterance.rate = 0.9; // സംസാരിക്കുന്ന വേഗത

        // ഓഡിയോ പറഞ്ഞുതീർന്നാൽ വീണ്ടും ആവർത്തിക്കാൻ (Loop)
        utterance.onend = function() {
            if (isSpeaking) {
                setTimeout(() => speakText(text), 1000); // 1 സെക്കൻഡ് ഗ്യാപ്പിന് ശേഷം വീണ്ടും പറയും
            }
        };

        synth.speak(utterance);
    }

    function stopAnnounce() {
        isSpeaking = false;
        synth.cancel();
    }
</script>

</body>
</html>
